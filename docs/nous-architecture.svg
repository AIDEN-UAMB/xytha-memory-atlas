<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title"><title id="title">Nous 1.0: plan, compute, assemble, validate, deliver, remember</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6b91ad"/></marker></defs><rect width="1200" height="420" rx="22" fill="#edf4f7"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="53" font-size="20" fill="#1c3c53">NOUS 1.0 / EXECUTION MAP</text><text x="40" y="82" font-size="13" fill="#648095">One bounded orchestrator, with inspectable state and source-bound evidence.</text><g fill="#fff" stroke="#c5d8e4"><rect x="40" y="132" width="180" height="92" rx="16"/><rect x="270" y="132" width="180" height="92" rx="16"/><rect x="500" y="132" width="180" height="92" rx="16"/><rect x="730" y="132" width="180" height="92" rx="16"/><rect x="960" y="132" width="200" height="92" rx="16"/><rect x="270" y="292" width="640" height="75" rx="16"/></g><g stroke="#6b91ad" fill="none" marker-end="url(#a)"><path d="M220 178H262M450 178H492M680 178H722M910 178H952"/><path d="M1060 224V328H918"/><path d="M270 328H130V232"/></g><g fill="#264b66" font-size="17"><text x="62" y="169">Plan</text><text x="292" y="169">Compute</text><text x="522" y="169">Assemble</text><text x="752" y="169">Check</text><text x="982" y="169">Deliver</text><text x="294" y="324">Memory / checkpoints / source provenance</text></g><g fill="#688196" font-size="12"><text x="62" y="197">Rules + semantic help</text><text x="292" y="197">Chart + time queries</text><text x="522" y="197">Facts + relevant history</text><text x="752" y="197">Contracts + review*</text><text x="982" y="197">Saved answer + SSE</text><text x="294" y="347">Preserve sources. Bound calls. Reuse completed phases.</text><text x="40" y="397">* Direct-output mode bypasses contract review. Answer chunks follow complete generation in version 1.0.</text></g></g></svg>
