name: Henosis 1.0 checks
on:
  push:
    branches: [main]
    paths: ['henosis-1.0/**', '.github/workflows/henosis.yml']
  pull_request:
    paths: ['henosis-1.0/**', '.github/workflows/henosis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: henosis-1.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run demo
      - run: npm run check
