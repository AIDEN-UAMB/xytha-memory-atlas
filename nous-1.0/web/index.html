<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nous 1.0 · Xytha</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a href="https://xytha.com" target="_blank" rel="noreferrer"><img src="/mark.svg" alt="Xytha" width="38" height="38"></a><span>Xytha <strong>Nous</strong><small>1.0 / OPEN SOURCE</small></span><a href="https://github.com/AIDEN-UAMB/xytha-memory-atlas/tree/main/nous-1.0" target="_blank" rel="noreferrer">源代码 ↗</a></header>
<main><aside><p class="eyebrow">A TRACEABLE PERSPECTIVE</p><h1>让回答<br>有据可循。</h1><p class="muted">自适应任务规划、确定性排盘与可追溯记忆。Nous-1.0 独立运行工作台。</p><label for="profile">当前命主</label><select id="profile"></select><p id="mode" class="status" aria-live="polite">正在连接本地服务…</p>
<details><summary>创建本地命主</summary><form id="profile-form"><label>姓名<input name="name" maxlength="40" required></label><label>公历生日<input name="date" type="date" min="1900-01-01" max="2100-12-31" required></label><label>出生时间<input name="time" type="time" value="12:00" required></label><label>排盘性别<select name="gender"><option>男</option><option>女</option></select></label><label>地区<input name="place" maxlength="80" placeholder="记录地区；不自动换算真太阳时"></label><button>保存到本机</button></form></details>
<div class="tools"><label for="date">观察日期</label><input id="date" type="date"><button id="chart">查看排盘数据</button><button id="memory">查看结构化记忆</button></div><details id="data-panel"><summary id="data-title">结构化资料</summary><pre id="data"></pre></details><p class="fine">资料保存于本机 .runtime。使用自备模型时，所需上下文会发送至你配置的供应商。传统解读与现实事实须区分。</p></aside>
<section class="workspace" aria-label="对话工作区"><div id="messages"><div class="welcome"><span class="eyebrow">NOUS / 1.0</span><h2>从一个问题开始。</h2><p>选择命主，查看推理依据与阶段进度。</p><p class="fine">未配置模型时，仅呈现程序计算结果。</p></div></div><div class="composer"><form id="chat-form"><label class="sr-only" for="question">向 Nous 提问</label><textarea id="question" maxlength="3000" required placeholder="例如：今年的事业主题有哪些？"></textarea><div class="composer-footer"><span id="progress" role="status">准备就绪</span><button id="send">发送 ↗</button><button id="stop" type="button" hidden>停止</button></div></form></div><p class="fine">1.0：阶段进度实时更新，正文完成后分段传送。完整生成过程的正文流式输出属于后续升级。</p></section></main><script type="module" src="/client.js"></script></body></html>
